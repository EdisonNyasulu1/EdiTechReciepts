# Render "Blueprint": New + -> Blueprint -> pick this repository. Creates the API service for you.
services:
  - type: web
    name: editech-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --omit=dev && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        # paste your Neon connection string when asked
        sync: false
      - key: CLIENT_URL          # your Vercel address, e.g. https://editech-graphix.vercel.app
        sync: false
      - key: JWT_SECRET          # generated for you (long and random)
        generateValue: true
      - key: COOKIE_SAMESITE     # "lax" because Vercel forwards /api (see README); use "none" if the browser calls this server directly
        value: lax
